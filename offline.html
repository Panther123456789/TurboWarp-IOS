<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - TurboWarp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        
        .offline-container {
            text-align: center;
            padding: 40px 20px;
        }
        
        .offline-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        p {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .retry-btn {
            background: #ff6b00;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .retry-btn:active {
            background: #e55a00;
        }
        
        .hint {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>Keine Verbindung</h1>
        <p>TurboWarp benötigt eine aktive Internetverbindung, um zu funktionieren.</p>
        
        <button class="retry-btn" onclick="window.location.reload()">Erneut versuchen</button>
        
        <div class="hint">
            <p><strong>Tipps:</strong></p>
            <ul style="text-align: left; display: inline-block; margin-top: 10px;">
                <li>Überprüfen Sie Ihre WLAN-Verbindung</li>
                <li>Versuchen Sie, die App neu zu starten</li>
                <li>Aktivieren Sie mobile Daten, wenn verfügbar</li>
            </ul>
        </div>
    </div>
</body>
</html>
